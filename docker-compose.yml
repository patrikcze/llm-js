# Full stack: agent web UI + local SearXNG search.
#   docker compose up -d --build     ->  UI on http://127.0.0.1:8787
#   make agent-up NAME=alpha         ->  more agents, each in its own container with its own workspace
#
# The LLM is NOT in this stack. By default the agent talks to a server on your host
# (llama.cpp / Ollama / LM Studio) through host.docker.internal, or to OpenAI / Anthropic
# once you pick them in the UI's config window.
#
# Works with Docker and Podman. With Docker add compose.docker.yml (the Makefile does):
#   docker compose -f docker-compose.yml -f compose.docker.yml up -d --build
services:
  agent:
    build:
      context: .
      args:
        WITH_NPM: ${WITH_NPM:-false} # true keeps npm/npx in the image (see Dockerfile)
    image: llm-agent:latest
    container_name: llm-agent
    labels:
      llm-agent.name: default
    restart: unless-stopped
    depends_on:
      - searxng
    ports:
      - "127.0.0.1:${AGENT_PORT:-8787}:8787" # localhost only
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container "localhost" is the container itself; reach the host's LLM server instead.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:9931/v1}
      SEARXNG_URL: http://searxng:8080
      TZ: ${TZ:-UTC} # `make docker-up` passes this machine's time zone
      # Access token for the UI and API (`make docker-up` creates one and prints the URL).
      # Empty = random per start, shown in `docker compose logs agent`.
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_OPEN_HINT: make docker-open
    volumes:
      - ${AGENT_WORKSPACE:-./playground}:/workspace
      - agent-config:/config
    # Hardening: commands the agent runs stay inside this container and can only write to
    # /workspace, /config and scratch tmpfs; no extra Linux capabilities, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp
      - /home/node:mode=1777 # Podman's tmpfs has no uid=/gid= options
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2

  searxng:
    # Pinned release and digest; Dependabot proposes updates.
    image: docker.io/searxng/searxng:2026.10.27-ef7bae9dd@sha256:64936ab0847aae6494d37edf688ce792b262e8467d48ad844c0bf3f899a45249
    container_name: llm-agent-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080" # localhost only; lets the agent run outside Docker too
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-only-change-me} # make generates a random one
      - FORCE_OWNERSHIP=false # runs unprivileged, so it must not try to chown
    # Hardening: the image would run as root; run it as its own user with a read-only root file
    # system, scratch tmpfs for its cache, no capabilities and no privilege gain.
    user: "977:977" # searxng
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/searxng:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    pids_limit: 256
    mem_limit: 512m

volumes:
  agent-config:

networks:
  # Fixed name so agents started with `make agent-up` can join and reach searxng.
  default:
    name: llm-agent-net
